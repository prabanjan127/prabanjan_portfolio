<div class="loading-screen" [class.hidden]="!isLoading">
  <div class="loading-content">
    <!-- Animated Developer Illustration Container -->
    <div class="illustration-wrapper">
      <img
        src="assets/images/developer-coding-animated.png"
        alt="Developer Coding"
        class="developer-illustration"
      />

      <!-- Animated Floating Icons -->
      <div class="floating-icon coffee-icon">
        <i class="fas fa-coffee"></i>
      </div>
      <div class="floating-icon code-icon">
        <i class="fas fa-code"></i>
      </div>
      <div class="floating-icon wifi-icon">
        <i class="fas fa-wifi"></i>
      </div>
      <div class="floating-icon headphones-icon">
        <i class="fas fa-headphones"></i>
      </div>

      <!-- Screen Glow Effect -->
      <div class="screen-glow"></div>

      <!-- Typing Indicator -->
      <div class="typing-indicator">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>

      <!-- Code Lines Animation -->
      <div class="code-lines">
        <div class="code-line"></div>
        <div class="code-line"></div>
        <div class="code-line"></div>
      </div>

      <!-- Ambient Particles -->
      <div class="ambient-particle particle-1"></div>
      <div class="ambient-particle particle-2"></div>
      <div class="ambient-particle particle-3"></div>
      <div class="ambient-particle particle-4"></div>
    </div>

    <!-- Loading Text -->
    <div class="loading-text">
      <h2 class="loading-title">
        <span class="text-gradient">Loading</span>
        <span class="dots">
          <span class="dot">.</span>
          <span class="dot">.</span>
          <span class="dot">.</span>
        </span>
      </h2>
      <p class="loading-subtitle font-mono-custom">Just a developer crafting something awesome</p>
    </div>

    <!-- Animated Quote -->
    <div class="quote-container">
      <div class="quote-mark">"</div>
      <p class="quote-text">
        {{ currentQuote }}
      </p>
      <div class="quote-mark closing">"</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>

    <!-- Loading Info -->
    <div class="loading-info">
      <span class="font-mono-custom text-blue-400">// CRAFTED_WITH_PASSION</span>
    </div>
  </div>

  <!-- Cyber Grid Background -->
  <div class="cyber-grid"></div>

  <!-- Background Glow Effects -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>
  <div class="glow-orb glow-orb-3"></div>
</div>
