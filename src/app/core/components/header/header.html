<header class="fixed top-0 left-0 right-0 z-50">
  <!-- Visual Header Bar (Glass Effect) -->
  <div class="glass-panel border-b border-blue-500/20"
    style="height: var(--header-height); border-radius: 0; backdrop-filter: blur(20px);">
    <nav class="container-custom h-full flex items-center justify-between" aria-label="Main Navigation">
      <!-- Logo with Animation -->
      <a routerLink="/" class="text-xl sm:text-2xl font-bold font-mono-custom group flex items-center gap-2.5 focus-visible:ring-2 focus-visible:ring-blue-400 rounded-lg outline-none">
        <div
          class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center group-hover:scale-110 transition-transform shadow-lg shadow-blue-500/50">
          <span class="text-white text-sm font-bold">PS</span>
        </div>
        <span class="text-white font-semibold tracking-tight">Prabanjan <span class="text-blue-400">S</span></span>
      </a>

      <!-- Desktop Navigation -->
      <ul class="hidden lg:flex items-center gap-7">
        <li>
          <a routerLink="/" routerLinkActive="text-blue-400 border-b-2 border-blue-400" [routerLinkActiveOptions]="{exact: true}"
            class="font-mono-custom text-sm hover:text-blue-400 transition-all pb-1 relative group focus-visible:ring-2 focus-visible:ring-blue-400 rounded outline-none">
            <span class="relative z-10">home</span>
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-blue-400 group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
        <li>
          <button type="button" (click)="navigateToSection('about')"
            class="font-mono-custom text-sm text-gray-300 hover:text-blue-400 transition-all pb-1 relative group focus-visible:ring-2 focus-visible:ring-blue-400 rounded outline-none cursor-pointer">
            <span class="relative z-10">about</span>
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-blue-400 group-hover:w-full transition-all duration-300"></span>
          </button>
        </li>
        <li>
          <button type="button" (click)="navigateToSection('experience')"
            class="font-mono-custom text-sm text-gray-300 hover:text-blue-400 transition-all pb-1 relative group focus-visible:ring-2 focus-visible:ring-blue-400 rounded outline-none cursor-pointer">
            <span class="relative z-10">experience</span>
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-blue-400 group-hover:w-full transition-all duration-300"></span>
          </button>
        </li>
        <li>
          <button type="button" (click)="navigateToSection('skills')"
            class="font-mono-custom text-sm text-gray-300 hover:text-blue-400 transition-all pb-1 relative group focus-visible:ring-2 focus-visible:ring-blue-400 rounded outline-none cursor-pointer">
            <span class="relative z-10">skills</span>
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-blue-400 group-hover:w-full transition-all duration-300"></span>
          </button>
        </li>
        <li>
          <button type="button" (click)="navigateToSection('projects')"
            class="font-mono-custom text-sm text-gray-300 hover:text-blue-400 transition-all pb-1 relative group focus-visible:ring-2 focus-visible:ring-blue-400 rounded outline-none cursor-pointer">
            <span class="relative z-10">works</span>
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-blue-400 group-hover:w-full transition-all duration-300"></span>
          </button>
        </li>
        <li>
          <a routerLink="/contact" routerLinkActive="text-blue-400 border-b-2 border-blue-400"
            class="font-mono-custom text-sm hover:text-blue-400 transition-all pb-1 relative group focus-visible:ring-2 focus-visible:ring-blue-400 rounded outline-none">
            <span class="relative z-10">contact</span>
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-blue-400 group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
      </ul>

      <!-- Action Buttons (Desktop) -->
      <div class="hidden lg:flex items-center gap-3">
        <a href="https://linkedin.com/in/prabanjan-s" target="_blank" rel="noopener noreferrer"
          class="p-2.5 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-400/30 rounded-lg transition-all duration-300 hover:scale-105"
          title="LinkedIn Profile" aria-label="LinkedIn Profile">
          <i class="fab fa-linkedin text-base"></i>
        </a>
        <a href="https://github.com/prabanjan127" target="_blank" rel="noopener noreferrer"
          class="px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-lg transition-all duration-300 font-mono-custom text-xs shadow-lg shadow-blue-500/30 hover:scale-105 flex items-center gap-2"
          aria-label="GitHub Profile">
          <i class="fab fa-github"></i>
          <span>GitHub</span>
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button (click)="toggleMobileMenu()"
        class="lg:hidden text-blue-400 hover:text-blue-300 transition-colors p-2.5 rounded-lg border border-blue-400/20 bg-blue-500/10 focus-visible:ring-2 focus-visible:ring-blue-400 outline-none"
        aria-label="Toggle mobile navigation menu" [attr.aria-expanded]="isMobileMenuOpen">
        <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </nav>
  </div>

  <!-- Mobile Menu Overlay -->
  <div *ngIf="isMobileMenuOpen" class="mobile-menu-overlay" (click)="closeMobileMenu()">
  </div>

  <!-- Mobile Menu Panel -->
  <div class="mobile-menu-panel" [class.open]="isMobileMenuOpen">
    <!-- Close Button inside Panel -->
    <button (click)="closeMobileMenu()"
      class="absolute top-6 right-6 text-white/70 hover:text-white p-3 z-50 transition-colors rounded-lg focus-visible:ring-2 focus-visible:ring-blue-400 outline-none"
      aria-label="Close menu">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <div class="text-center mb-6">
      <div class="w-14 h-14 mx-auto rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/50 mb-3">
        <span class="text-white text-lg font-bold">PS</span>
      </div>
      <p class="text-white font-bold text-lg font-mono-custom">Prabanjan S</p>
      <p class="text-blue-400 text-xs font-mono-custom">Angular Developer & Front-End Engineer</p>
    </div>

    <nav class="space-y-3 w-full max-w-xs text-center">
      <a routerLink="/" (click)="closeMobileMenu()"
        class="block font-mono-custom text-xl font-semibold hover:text-blue-400 transition-all py-2.5 text-gray-200">
        home
      </a>
      <button type="button" (click)="navigateToSection('about')"
        class="w-full block font-mono-custom text-xl font-semibold hover:text-blue-400 transition-all py-2.5 text-gray-200 cursor-pointer">
        about
      </button>
      <button type="button" (click)="navigateToSection('experience')"
        class="w-full block font-mono-custom text-xl font-semibold hover:text-blue-400 transition-all py-2.5 text-gray-200 cursor-pointer">
        experience
      </button>
      <button type="button" (click)="navigateToSection('skills')"
        class="w-full block font-mono-custom text-xl font-semibold hover:text-blue-400 transition-all py-2.5 text-gray-200 cursor-pointer">
        skills
      </button>
      <button type="button" (click)="navigateToSection('projects')"
        class="w-full block font-mono-custom text-xl font-semibold hover:text-blue-400 transition-all py-2.5 text-gray-200 cursor-pointer">
        works
      </button>
      <a routerLink="/contact" (click)="closeMobileMenu()"
        class="block font-mono-custom text-xl font-semibold hover:text-blue-400 transition-all py-2.5 text-gray-200">
        contact
      </a>

      <div class="pt-4 flex flex-col gap-3">
        <a href="https://github.com/prabanjan127" target="_blank" rel="noopener noreferrer"
          class="px-6 py-3 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-xl transition-all duration-300 font-mono-custom text-sm shadow-lg shadow-blue-500/30 flex items-center justify-center gap-3 w-full">
          <i class="fab fa-github text-lg"></i>
          <span>GitHub</span>
        </a>
        <a href="https://linkedin.com/in/prabanjan-s" target="_blank" rel="noopener noreferrer"
          class="px-6 py-3 border border-cyan-400/40 text-cyan-300 hover:bg-cyan-500/10 rounded-xl transition-all duration-300 font-mono-custom text-sm flex items-center justify-center gap-3 w-full">
          <i class="fab fa-linkedin text-lg"></i>
          <span>LinkedIn</span>
        </a>
      </div>
    </nav>
  </div>
</header>
