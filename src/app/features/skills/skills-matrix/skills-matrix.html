<section class="py-32 bg-black/20">
  <div class="container-custom">
    <h2 class="text-4xl md:text-5xl font-bold mb-20 text-center">
      <span class="text-neon">&lt;</span>Skills_Matrix<span class="text-neon">/&gt;</span>
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div *ngFor="let category of skillCategories" class="glass-panel p-8 hover:bg-white/5 transition-all duration-300 reveal-child">
        <h3 class="text-2xl font-bold text-white mb-8 pb-4 border-b border-white/10 flex items-center gap-3">
          <i class="fas fa-terminal text-primary text-sm"></i>
          {{ category.title }}
        </h3>
        <div class="flex flex-wrap gap-3">
          <span *ngFor="let skill of category.skills" class="px-4 py-2 bg-white/5 text-gray-300 text-sm font-mono-custom rounded border border-white/10 hover:border-primary/50 hover:text-white hover:bg-primary/10 transition-all cursor-default">
            {{ skill }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
