<section id="projects" class="py-32 relative">
  <!-- Decorative elements with Parallax -->
  <div class="absolute top-20 right-10 w-64 h-64 bg-primary/5 rounded-full blur-3xl" appParallax [parallaxRatio]="0.08">
  </div>
  <div class="absolute bottom-20 left-10 w-96 h-96 bg-secondary/5 rounded-full blur-3xl" appParallax
    [parallaxRatio]="0.12"></div>


  <div class="container-custom relative z-10">
    <div class="text-center mb-16">
      <h2 class="text-5xl md:text-6xl font-bold mb-6">
        <span class="text-neon font-mono-custom">&lt;</span>Featured<span class="text-neon">_</span>Projects<span
          class="text-neon font-mono-custom">/&gt;</span>
      </h2>
      <p class="text-gray-400 text-lg font-mono-custom">Building the future, one commit at a time</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let project of projects; let i = index; trackBy: trackByProject"
        class="group relative rounded-2xl overflow-hidden glass-panel reveal-child flex flex-col">

        <!-- Project Number Label -->
        <div class="absolute top-4 left-4 z-30">
          <div class="px-3 py-1.5 bg-black/70 backdrop-blur-sm border border-white/10 rounded-lg">
            <span class="text-primary font-mono-custom font-bold text-xs">_{{ formatNumber(i + 1) }}</span>
          </div>
        </div>

        <!--Project Image -->
        <div class="absolute inset-0 overflow-hidden">
          <img [src]="project.image" [alt]="project.title + ' screenshot'" loading="lazy"
            class="w-full h-full object-cover opacity-40 group-hover:opacity-60 group-hover:scale-110 transition-all duration-700" />
          <!-- Overlay for better text readability -->
          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-black/40"></div>
        </div>

        <!-- Content -->
        <div class="relative pb-6 px-6 pt-12 flex flex-col h-full z-20">
          <!-- Tech Tags -->
          <div class="flex flex-wrap gap-2 mb-3 mt-3">
            <span *ngFor="let tag of project.tags.slice(0, 3)"
              class="text-xs font-mono-custom uppercase tracking-wider px-2.5 py-1 border border-white/20 rounded-full bg-black/60 backdrop-blur-sm text-gray-300 hover:border-primary/50 hover:text-primary transition-all">
              {{ tag }}
            </span>
          </div>

          <!-- Metrics Badge -->
          <div *ngIf="project.metrics" class="mb-4">
            <span
              class="text-xs font-mono-custom px-2.5 py-1 bg-emerald-500/10 border border-emerald-400/30 rounded-full text-emerald-400 inline-flex items-center">
              <i class="fas fa-check-circle mr-1"></i>{{ project.metrics }}
            </span>
          </div>

          <!-- Spacer to push content down -->
          <div class="flex-grow min-h-[120px]"></div>

          <!-- Bottom Section: Title, Description & Links -->
          <div class="space-y-3">
            <!-- Title -->
            <h3
              class="text-2xl md:text-3xl font-bold text-white group-hover:text-primary transition-colors leading-tight">
              {{ project.title }}
            </h3>

            <!-- Description -->
            <p class="text-gray-400 text-sm leading-relaxed line-clamp-3 group-hover:text-gray-300 transition-colors">
              {{ project.description }}
            </p>

            <!-- Action Buttons -->
            <div class="flex items-center gap-3 pt-2">
              <!-- GitHub Link -->
              <a [href]="project.link" target="_blank"
                class="flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/10 hover:border-primary/50 rounded-lg text-white text-xs font-mono-custom transition-all group/btn">
                <i class="fab fa-github"></i>
                <span>Code</span>
                <i
                  class="fas fa-arrow-right text-[10px] transform group-hover/btn:translate-x-1 transition-transform"></i>
              </a>

              <!-- Demo Link (if available) -->
              <a *ngIf="project.demo" [href]="project.demo" target="_blank"
                class="flex items-center gap-2 px-4 py-2 bg-primary/10 hover:bg-primary/20 border border-primary/30 hover:border-primary/60 rounded-lg text-primary text-xs font-mono-custom transition-all group/btn">
                <i class="fas fa-external-link-alt"></i>
                <span>Demo</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Hover Glow Border -->
        <div
          class="absolute inset-0 border-2 border-transparent group-hover:border-primary/40 rounded-2xl transition-all duration-500 pointer-events-none">
        </div>

        <!-- Corner Accent -->
        <div
          class="absolute top-0 right-0 w-32 h-32 bg-primary/5 blur-3xl group-hover:bg-primary/10 transition-all duration-700">
        </div>
      </div>
    </div>

    <!-- View All Projects Link -->
    <div class="text-center mt-16">
      <a href="https://github.com/prabanjan127?tab=repositories" target="_blank"
        class="inline-flex items-center gap-3 px-8 py-4 border-2 border-white/20 hover:border-primary text-white hover:text-primary font-mono-custom text-sm rounded-lg transition-all duration-300 hover-lift group">
        <span>View All on GitHub</span>
        <i class="fab fa-github text-xl group-hover:rotate-12 transition-transform"></i>
      </a>
    </div>
  </div>
</section>
