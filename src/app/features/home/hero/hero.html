<section class="relative w-full min-h-screen flex items-center justify-center overflow-hidden py-20 px-4">
  <!-- 3D Background with Parallax -->
  <app-three-scene class="absolute inset-0 z-0" appParallax [parallaxRatio]="0.1"></app-three-scene>

  <!-- Animated Particles Effect with Parallax -->
  <div class="absolute inset-0 z-[1] opacity-30" appParallax [parallaxRatio]="0.2">
    <div class="absolute top-1/4 left-1/4 w-2 h-2 bg-blue-400 rounded-full animate-ping"></div>
    <div class="absolute top-1/2 right-1/3 w-1 h-1 bg-cyan-400 rounded-full animate-pulse" style="animation-delay: 1s;">
    </div>
    <div class="absolute bottom-1/3 left-1/2 w-3 h-3 bg-purple-400 rounded-full animate-bounce"
      style="animation-delay: 0.5s;"></div>
    <div class="absolute top-2/3 right-1/4 w-2 h-2 bg-pink-400 rounded-full animate-ping"
      style="animation-delay: 1.5s;"></div>
  </div>

  <!-- Gradient Mesh with Parallax -->
  <div
    class="absolute inset-0 z-[1] bg-gradient-to-br from-blue-600/10 via-transparent to-purple-600/10 animate-gradient"
    style="background-size: 400% 400%;" appParallax [parallaxRatio]="0.15"></div>

  <!-- Content Overlay -->
  <div class="relative z-10 w-full max-w-7xl mx-auto">
    <!-- Main Hero Container -->
    <div class="flex flex-col lg:flex-row items-center justify-between gap-8 lg:gap-12">

      <!-- Left Side: Text Content -->
      <div class="flex-1 text-center lg:text-left w-full">

        <!-- Status Badge -->
        <div class="inline-block mb-6 animate-float">
          <span
            class="px-4 py-2 bg-emerald-500/10 border border-emerald-400/40 rounded-full text-xs font-mono-custom text-emerald-400 tracking-wider uppercase backdrop-blur-md animate-pulse-glow inline-flex items-center gap-2">
            <span class="relative flex h-2 w-2">
              <span
                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            Crafting Digital Experiences
          </span>
        </div>

        <!-- Main Heading -->
        <h1 #heroTitle class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-bold leading-tight mb-4 tracking-tight">
          <span class="block text-white mb-2">Hi! I'm</span>
          <span
            class="block text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-300 to-purple-400 animate-gradient glow-text break-words">Prabanjan</span>
        </h1>

        <!-- Animated Subtitle -->
        <div class="h-10 mb-6 flex justify-center lg:justify-start items-center">
          <span class="text-blue-400/60 font-mono-custom text-sm mr-2">&gt;</span>
          <p #heroSubtitle class="text-base md:text-lg lg:text-xl font-mono-custom text-gray-300"></p>
          <span class="w-[2px] h-6 bg-blue-400 ml-1 animate-blink shadow-[0_0_10px_rgba(59,130,246,0.8)]"></span>
        </div>

        <!-- Tech Stack Pills -->
        <div class="flex flex-wrap justify-center lg:justify-start gap-2 mb-6">
          <app-tech-badge label="Angular" icon="fas fa-code" color="blue"></app-tech-badge>
          <app-tech-badge label="Node.js" icon="fab fa-node" color="cyan"></app-tech-badge>
          <app-tech-badge label="Security" icon="fas fa-shield-alt" color="purple"></app-tech-badge>
          <app-tech-badge label="Flutter" icon="fas fa-mobile-alt" color="pink"></app-tech-badge>
        </div>

        <!-- CTA Buttons -->
        <div #ctaButton class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start items-center mb-8">
          <a href="#projects"
            class="group relative px-8 py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold text-sm tracking-wide hover:from-blue-600 hover:to-blue-700 transition-all duration-300 rounded-xl overflow-hidden shadow-lg shadow-blue-500/50 hover:shadow-blue-500/70 hover:scale-105 w-full sm:w-auto text-center">
            <span class="relative z-10 flex items-center justify-center gap-2">
              <i class="fas fa-rocket"></i>
              <span>View Projects</span>
              <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3">
                </path>
              </svg>
            </span>
          </a>

          <a href="mailto:prabanjansakthibabu@gmail.com"
            class="group px-8 py-3 border-2 border-blue-400/40 hover:border-blue-400 text-white font-mono-custom text-sm hover:bg-blue-500/10 rounded-xl transition-all duration-300 hover:scale-105 backdrop-blur-sm w-full sm:w-auto text-center">
            <i class="far fa-envelope mr-2"></i>Contact_Me
          </a>
        </div>

        <!-- Stats Section -->
        <div class="grid grid-cols-3 gap-4 lg:gap-6 mt-8 pt-8 border-t border-blue-500/20">
          <app-stat-card value="2+" colorStart="blue" colorEnd="cyan" alignment="text-center lg:text-left">
            Years of<br />Experience
          </app-stat-card>
          <app-stat-card value="15+" colorStart="purple" colorEnd="pink" alignment="text-center">
            Projects<br />Completed
          </app-stat-card>
          <app-stat-card value="10+" colorStart="cyan" colorEnd="emerald" alignment="text-center lg:text-right">
            Technologies<br />Learned
          </app-stat-card>
        </div>

        <!-- Social Links -->
        <div class="flex justify-center lg:justify-start gap-4 mt-6">
          <app-social-link *ngFor="let link of socialLinks; trackBy: trackBySocialLink" [href]="link.href"
            [icon]="link.icon" [label]="link.label" [color]="link.color">
          </app-social-link>
        </div>
      </div>

      <!-- Right Side: Profile Photo -->
      <div class="flex-shrink-0 animate-float mt-8 lg:mt-0">
        <div class="relative group">
          <!-- Animated border rings -->
          <div
            class="absolute -inset-1 rounded-full bg-gradient-to-r from-blue-500 via-cyan-400 to-purple-500 animate-spin-slow opacity-75 blur-sm group-hover:blur-md transition-all"
            style="animation-duration: 8s;"></div>
          <div
            class="absolute -inset-2 rounded-full bg-gradient-to-r from-purple-500 via-pink-400 to-blue-500 animate-spin-slow opacity-50 blur-md"
            style="animation-duration: 12s; animation-direction: reverse;"></div>

          <!-- Profile image container -->
          <div
            class="relative w-48 h-48 sm:w-56 sm:h-56 md:w-64 md:h-64 lg:w-72 lg:h-72 rounded-full overflow-hidden border-4 border-blue-400/30 shadow-[0_0_50px_rgba(59,130,246,0.5)] group-hover:shadow-[0_0_80px_rgba(59,130,246,0.8)] transition-all duration-500">
            <img src="assets/images/profile.jpg" alt="Prabanjanakthibabu"
              class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500" />
            <!-- Overlay gradient on hover -->
            <div
              class="absolute inset-0 bg-gradient-to-t from-blue-900/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500">
            </div>
          </div>

          <!-- Corner accents -->
          <div
            class="absolute -top-2 -left-2 w-5 h-5 border-t-2 border-l-2 border-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity">
          </div>
          <div
            class="absolute -top-2 -right-2 w-5 h-5 border-t-2 border-r-2 border-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity">
          </div>
          <div
            class="absolute -bottom-2 -left-2 w-5 h-5 border-b-2 border-l-2 border-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity">
          </div>
          <div
            class="absolute -bottom-2 -right-2 w-5 h-5 border-b-2 border-r-2 border-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity">
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Enhanced Scroll Indicator -->
  <div
    class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-2 opacity-70 hover:opacity-100 transition-all">
    <span class="text-[10px] font-mono-custom uppercase tracking-widest text-blue-400 animate-pulse">Explore</span>
    <div class="w-[2px] h-16 bg-gradient-to-b from-blue-400 via-cyan-400 to-transparent animate-pulse"></div>
    <i class="fas fa-chevron-down text-blue-400 animate-bounce text-sm"></i>
  </div>
</section>
