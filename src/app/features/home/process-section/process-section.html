<section class="py-32 relative overflow-hidden">
  <!-- Section Background -->
  <div class="absolute inset-0 bg-gradient-to-b from-transparent via-blue-950/5 to-transparent"></div>

  <div class="container-custom relative z-10">
    <!-- Section Header -->
    <div class="text-center mb-20">
      <h2 class="text-5xl md:text-6xl font-bold mb-6">
        <span class="text-white">My Development</span>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400"> Process</span>
      </h2>
      <p class="text-gray-400 text-lg max-w-2xl mx-auto font-mono-custom">
        Each project is unique, but I follow a consistent methodology to deliver exceptional results.
      </p>
    </div>

    <!-- Process Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6">
      <div *ngFor="let step of processSteps; let i = index"
           class="process-card group reveal-child"
           [class.delay-100]="i === 1"
           [class.delay-200]="i === 2"
           [class.delay-300]="i === 3"
           [class.delay-400]="i === 4">

        <!-- Card Content -->
        <div class="relative h-full p-8 glass-panel hover-lift">
          <!-- Step Number -->
          <div class="absolute top-4 right-4 text-6xl font-bold opacity-5 font-mono-custom">
            {{ i + 1 }}
          </div>

          <!-- Icon -->
          <div class="mb-6 relative">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center relative overflow-hidden"
                 [ngClass]="{
                   'bg-blue-500/10 border-2 border-blue-400/30': step.color === 'blue',
                   'bg-cyan-500/10 border-2 border-cyan-400/30': step.color === 'cyan',
                   'bg-purple-500/10 border-2 border-purple-400/30': step.color === 'purple',
                   'bg-pink-500/10 border-2 border-pink-400/30': step.color === 'pink',
                   'bg-indigo-500/10 border-2 border-indigo-400/30': step.color === 'indigo'
                 }">
              <i [class]="step.icon + ' text-2xl'"
                 [ngClass]="{
                   'text-blue-400': step.color === 'blue',
                   'text-cyan-400': step.color === 'cyan',
                   'text-purple-400': step.color === 'purple',
                   'text-pink-400': step.color === 'pink',
                   'text-indigo-400': step.color === 'indigo'
                 }"></i>

              <!-- Icon Glow Effect -->
              <div class="absolute inset-0 blur-xl opacity-0 group-hover:opacity-50 transition-opacity"
                   [ngClass]="{
                     'bg-blue-400': step.color === 'blue',
                     'bg-cyan-400': step.color === 'cyan',
                     'bg-purple-400': step.color === 'purple',
                     'bg-pink-400': step.color === 'pink',
                     'bg-indigo-400': step.color === 'indigo'
                   }"></div>
            </div>
          </div>

          <!-- Title -->
          <h3 class="text-2xl font-bold mb-4 group-hover:scale-105 transition-transform"
              [ngClass]="{
                'text-blue-400': step.color === 'blue',
                'text-cyan-400': step.color === 'cyan',
                'text-purple-400': step.color === 'purple',
                'text-pink-400': step.color === 'pink',
                'text-indigo-400': step.color === 'indigo'
              }">
            {{ step.title }}
          </h3>

          <!-- Description -->
          <p class="text-gray-400 text-sm leading-relaxed">
            {{ step.description }}
          </p>

          <!-- Bottom Accent Line -->
          <div class="absolute bottom-0 left-0 w-full h-1 transform origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-500"
               [ngClass]="{
                 'bg-gradient-to-r from-blue-400 to-cyan-400': step.color === 'blue',
                 'bg-gradient-to-r from-cyan-400 to-blue-400': step.color === 'cyan',
                 'bg-gradient-to-r from-purple-400 to-pink-400': step.color === 'purple',
                 'bg-gradient-to-r from-pink-400 to-purple-400': step.color === 'pink',
                 'bg-gradient-to-r from-indigo-400 to-purple-400': step.color === 'indigo'
               }"></div>
        </div>

        <!-- Connecting Arrow (hidden on last card and mobile) -->
        <div *ngIf="i < processSteps.length - 1"
             class="hidden lg:flex absolute top-1/2 -right-3 transform -translate-y-1/2 z-20">
          <i class="fas fa-arrow-right text-blue-400/30 text-xl"></i>
        </div>
      </div>
    </div>

    <!-- Call to Action -->
    <div class="text-center mt-16">
      <p class="text-gray-400 font-mono-custom mb-6">
        Ready to bring your ideas to life?
      </p>
      <a href="#contact"
         class="inline-flex items-center gap-3 px-8 py-4 bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold rounded-xl hover:from-blue-600 hover:to-cyan-600 transition-all duration-300 shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:scale-105">
        <span>Let's Work Together</span>
        <i class="fas fa-arrow-right"></i>
      </a>
    </div>
  </div>
</section>
