<section class="py-16 sm:py-24 md:py-32 relative overflow-hidden">
  <!-- Background Elements -->
  <div class="absolute top-0 right-0 w-1/3 h-full bg-gradient-to-l from-primary/5 to-transparent pointer-events-none">
  </div>

  <div class="container-custom">
    <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold mb-12 md:mb-20 text-center">
      <span class="text-neon">&lt;</span>Experience<span class="text-neon">/&gt;</span>
    </h2>

    <!-- DESKTOP VIEW: Timeline -->
    <div class="hidden md:block relative max-w-5xl mx-auto">
      <!-- Vertical Line -->
      <div
        class="absolute left-6 md:left-1/2 transform md:-translate-x-1/2 h-full w-[1px] bg-gradient-to-b from-transparent via-primary/30 to-transparent">
      </div>

      <div *ngFor="let exp of experiences; let i = index" #timelineItem
        class="mb-12 md:mb-24 flex flex-col md:flex-row justify-between items-start md:items-center w-full group reveal-child pl-14 md:pl-0">

        <!-- Left Side (or Date on Desktop) -->
        <div class="w-full md:w-5/12 mb-4 md:mb-0"
          [ngClass]="{'md:text-right md:order-1': i % 2 === 0, 'md:order-3 md:text-left': i % 2 !== 0}">
          <span class="hidden md:block text-neon font-mono-custom text-lg md:text-xl">{{ exp.period }}</span>
        </div>

        <!-- Dot -->
        <div
          class="z-10 order-first md:order-2 flex items-center justify-center w-3 h-3 md:w-4 md:h-4 bg-black border border-primary rounded-full group-hover:bg-primary group-hover:shadow-[0_0_20px_var(--primary)] transition-all duration-300 absolute left-4 md:relative md:left-auto mb-0">
          <div class="absolute w-full h-full rounded-full bg-primary opacity-0 group-hover:animate-ping"></div>
        </div>

        <!-- Content Card -->
        <div class="w-full md:w-5/12 relative" [ngClass]="{'md:order-3': i % 2 === 0, 'md:order-1': i % 2 !== 0}">
          <app-glass-card>
            <span class="md:hidden text-neon font-mono-custom text-xs mb-2 block">{{ exp.period }}</span>
            <h3 class="text-xl sm:text-2xl font-bold text-white mb-1">{{ exp.role }}</h3>
            <p class="text-primary/80 font-mono-custom text-xs sm:text-sm mb-3 md:mb-4">{{ exp.company }}</p>
            <p class="text-gray-400 text-sm md:text-base leading-relaxed">{{ exp.description }}</p>
          </app-glass-card>
        </div>
      </div>
    </div>

    <!-- MOBILE VIEW: Vertical Stack -->
    <div class="block md:hidden max-w-lg mx-auto px-4 space-y-8">
      <div *ngFor="let exp of experiences; let i = index" class="relative pl-6 border-l border-primary/20">
        <!-- Timeline point -->
        <div class="absolute -left-[5px] top-0 w-2.5 h-2.5 rounded-full bg-primary shadow-[0_0_10px_var(--primary)]">
        </div>

        <div class="mb-2">
          <span
            class="inline-block px-3 py-1 rounded-full bg-primary/10 border border-primary/20 text-primary text-xs font-mono-custom mb-2">
            {{ exp.period }}
          </span>
        </div>

        <app-glass-card class="block transform transition-transform duration-300 active:scale-98">
          <h3 class="text-xl font-bold text-white mb-1">{{ exp.role }}</h3>
          <p class="text-primary/80 font-mono-custom text-sm mb-3 flex items-center gap-2">
            <i class="fas fa-building text-xs"></i> {{ exp.company }}
          </p>
          <p class="text-gray-400 text-sm leading-relaxed">{{ exp.description }}</p>
        </app-glass-card>
      </div>
    </div>
  </div>
</section>
