<section class="py-32 relative overflow-hidden">
  <!-- Background Elements -->
  <div class="absolute top-0 right-0 w-1/3 h-full bg-gradient-to-l from-primary/5 to-transparent pointer-events-none"></div>

  <div class="container-custom">
    <h2 class="text-4xl md:text-5xl font-bold mb-20 text-center">
      <span class="text-neon">&lt;</span>Experience<span class="text-neon">/&gt;</span>
    </h2>

    <div class="relative max-w-5xl mx-auto">
      <!-- Vertical Line -->
      <div class="absolute left-0 md:left-1/2 transform md:-translate-x-1/2 h-full w-[1px] bg-gradient-to-b from-transparent via-primary/30 to-transparent"></div>

      <div *ngFor="let exp of experiences; let i = index" #timelineItem class="mb-24 flex flex-col md:flex-row justify-between items-center w-full group reveal-child">

        <!-- Left Side (or Date on Desktop) -->
        <div class="w-full md:w-5/12 mb-8 md:mb-0" [ngClass]="{'md:text-right md:order-1': i % 2 === 0, 'md:order-3 md:text-left': i % 2 !== 0}">
           <span class="hidden md:block text-neon font-mono-custom text-xl">{{ exp.period }}</span>
        </div>

        <!-- Dot -->
        <div class="z-10 order-first md:order-2 flex items-center justify-center w-4 h-4 bg-black border border-primary rounded-full group-hover:bg-primary group-hover:shadow-[0_0_20px_var(--primary)] transition-all duration-300 relative mb-8 md:mb-0">
            <div class="absolute w-full h-full rounded-full bg-primary opacity-0 group-hover:animate-ping"></div>
        </div>

        <!-- Content Card -->
        <div class="w-full md:w-5/12 relative" [ngClass]="{'md:order-3': i % 2 === 0, 'md:order-1': i % 2 !== 0}">
          <app-glass-card>
            <span class="md:hidden text-neon font-mono-custom text-xs mb-2 block">{{ exp.period }}</span>
            <h3 class="text-2xl font-bold text-white mb-1">{{ exp.role }}</h3>
            <p class="text-primary/80 font-mono-custom text-sm mb-4">{{ exp.company }}</p>
            <p class="text-gray-400 text-base leading-relaxed">{{ exp.description }}</p>
          </app-glass-card>
        </div>
      </div>
    </div>
  </div>
</section>
